<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسئلة تفاعلية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- زر الوضع الليلي -->
        <div class="theme-toggle">
            <button id="themeToggle">
                <i class="fas fa-moon"></i> وضع ليلي
            </button>
        </div>

        <!-- رأس الموقع -->
        <header>
            <h1><i class="fas fa-brain"></i> اختبار المعرفة</h1>
            <p>اختبر معلوماتك مع أسئلة تفاعلية متنوعة</p>
        </header>

        <!-- إحصائيات -->
        <div class="stats">
            <div class="stat-card">
                <span id="currentQuestion">0</span>
                <p>سؤال حالي</p>
            </div>
            <div class="stat-card">
                <span id="totalQuestions">0</span>
                <p>إجمالي الأسئلة</p>
            </div>
            <div class="stat-card">
                <span id="score">0</span>
                <p>النتيجة</p>
            </div>
        </div>

        <!-- حاوية الأسئلة -->
        <div class="quiz-container">
            <div id="questionContainer">
                <!-- سيتم تحميل الأسئلة هنا -->
            </div>
            
            <!-- أزرار التحكم -->
            <div class="controls">
                <button id="prevBtn" class="btn-secondary">
                    <i class="fas fa-arrow-right"></i> السابق
                </button>
                <button id="nextBtn" class="btn-primary">
                    التالي <i class="fas fa-arrow-left"></i>
                </button>
                <button id="submitBtn" class="btn-success">
                    <i class="fas fa-paper-plane"></i> تصحيح الإجابات
                </button>
                <button id="restartBtn" class="btn-warning">
                    <i class="fas fa-redo"></i> إعادة الاختبار
                </button>
            </div>
        </div>

        <!-- النتائج -->
        <div id="results" class="results-container" style="display: none;">
            <h2><i class="fas fa-chart-line"></i> النتائج</h2>
            <div class="result-card">
                <h3 id="finalScore">0</h3>
                <p>من إجمالي <span id="totalScore">0</span> سؤال</p>
                <p id="resultMessage"></p>
            </div>
            <button id="showAnswers" class="btn-info">
                <i class="fas fa-eye"></i> عرض الإجابات الصحيحة
            </button>
        </div>

        <!-- روابط -->
        <footer>
            <a href="admin.html" class="admin-link">
                <i class="fas fa-cog"></i> إدارة الأسئلة (للمشرف)
            </a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
